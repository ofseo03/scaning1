[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scan2doc"
version = "0.1.0"
description = "사진·스크린샷·PDF를 OCR로 스캔해 Word(.docx)와 한글(.hwpx/.hwpml) 문서로 변환합니다."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ocr", "hwp", "hwpx", "docx", "korean", "pdf", "scan", "web", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
    "Natural Language :: Korean",
]
dependencies = [
    "pillow>=10.0",
    "python-docx>=1.1.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
preprocess = ["numpy>=1.24", "opencv-python-headless>=4.8"]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
dev = ["pytest>=7.4", "httpx>=0.27"]

[project.scripts]
scan2doc = "scan2doc.cli:main"

[project.gui-scripts]
scan2doc-gui = "scan2doc.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 웹 화면(HTML·CSS·JS·아이콘)은 패키지 안에 함께 담아 배포한다.
"scan2doc.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
