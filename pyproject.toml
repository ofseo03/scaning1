[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scan2doc"
version = "0.1.0"
description = "사진·스크린샷·PDF를 OCR로 스캔해 Word(.docx)와 한글(.hwpx/.hwpml) 문서로 변환합니다."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ocr", "hwp", "hwpx", "docx", "korean", "pdf", "scan"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
    "Natural Language :: Korean",
]
dependencies = [
    "pillow>=10.0",
    "python-docx>=1.1.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
preprocess = ["numpy>=1.24", "opencv-python-headless>=4.8"]
dev = ["pytest>=7.4"]

[project.scripts]
scan2doc = "scan2doc.cli:main"

[project.gui-scripts]
scan2doc-gui = "scan2doc.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
